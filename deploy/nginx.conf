# ============================================
# MangaGrid AI - Nginx 反向代理配置
# ============================================
# 安装：复制到 /etc/nginx/sites-available/mangagrid 并软链到 sites-enabled
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mangagrid
#   sudo ln -s /etc/nginx/sites-available/mangagrid /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 将下方 your-domain.com 替换为实际域名。

upstream mangagrid_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 上传体积上限（头像 / 生图回调体）
    client_max_body_size 20m;

    # gzip 压缩（HTML/JS/CSS/JSON/SVG）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 健康检查（供监控 / 负载均衡探活，直接透传）
    location = /api/health {
        proxy_pass http://mangagrid_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Next.js 静态资源：带内容哈希，长缓存
    location /_next/static/ {
        proxy_pass http://mangagrid_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 本地存储模式（未配置 COS 时）的图片直出
    # 配置 COS 后可删除此块；签名 URL 走 /api/uploads 代理
    location /uploads/ {
        alias /var/www/mangagrid/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 应用主体
    location / {
        proxy_pass http://mangagrid_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 批量生图 / PDF 导出为长请求，放宽超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }
}

# ============================================
# HTTPS（推荐）：用 certbot 签发后自动生成，或手动启用：
#   sudo certbot --nginx -d your-domain.com
# 注意：启用 HTTPS 后需同步把 .env.local 的 NEXTAUTH_URL 改为 https:// 前缀
# ============================================
